<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop - Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D1232A">
    <link rel="apple-touch-icon" href="assets/images/man.png">
    <link rel="icon" type="image/x-icon" href="assets/images/man.png">
    <link rel="preload" as="image" href="assets/images/barber.webp">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-container">
        <div class="brand-showcase">
            <h1>BARBERSHOP</h1>
            <p>WE ARE OPEN</p>
            <p class="hours">at 10.00 - 21.00 EAT</p>
        </div>
        
        <!-- Simplified Entry Button -->
        <button id="login-btn" class="primary-btn">Log In</button>
        <button id="install-btn" class="secondary-btn" hidden>Install App</button>
    </main>

    <script src="js/login.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully.');
                    })
                    .catch((err) => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
